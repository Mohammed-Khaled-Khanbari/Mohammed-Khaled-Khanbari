name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 06:17 Sana'a time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-cards.mjs
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG cards
        run: node scripts/generate-cards.mjs
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to
          # include private contributions; otherwise the built-in token is used.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.svg assets/languages.svg assets/activity.svg
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
