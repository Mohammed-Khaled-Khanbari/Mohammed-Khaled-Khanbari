<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="GitHub activity: 345 contributions in 2026, 3-day streak">
  <title>GitHub activity: 345 contributions in 2026, 3-day streak</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211613"/><stop offset="1" stop-color="#140E0C"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .fade { animation: fade .7s ease-out backwards; }
      @keyframes fade { from { opacity: 0 } }
      .grow { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
      @keyframes grow { from { transform: scaleX(0) } }
      @media (prefers-reduced-motion: reduce) { .fade, .grow { animation: none } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="219" rx="16" fill="url(#bg)" stroke="rgba(251,239,227,0.10)"/>
  <rect x="28" y="31" width="8" height="8" rx="2" fill="#EB5E34"/>
  <text x="46" y="40" class="mono" font-size="12" letter-spacing="2.4" fill="#D9A56B">ACTIVITY</text>
  <g class="fade" style="animation-delay:0.1s">
    <text x="28" y="92" class="sans" font-size="30" font-weight="700" fill="#FBEFE3">345</text>
    <text x="28" y="114" class="sans" font-size="13" fill="#B9A79A">Contributions in 2026</text>
  </g>
  <g class="fade" style="animation-delay:0.18s">
    <text x="178" y="92" class="sans" font-size="30" font-weight="700" fill="#FBEFE3">45</text>
    <text x="178" y="114" class="sans" font-size="13" fill="#B9A79A">Active days in 2026</text>
  </g>
  <g class="fade" style="animation-delay:0.26s">
    <text x="28" y="168" class="sans" font-size="30" font-weight="700" fill="#FBEFE3">1,233</text>
    <text x="28" y="190" class="sans" font-size="13" fill="#B9A79A">Pull requests</text>
  </g>
  <g class="fade" style="animation-delay:0.33999999999999997s">
    <text x="178" y="168" class="sans" font-size="30" font-weight="700" fill="#FBEFE3">1</text>
    <text x="178" y="190" class="sans" font-size="13" fill="#B9A79A">Stars earned</text>
  </g>
  <line x1="332" y1="32" x2="332" y2="188" stroke="rgba(251,239,227,0.10)"/>
  <circle cx="420" cy="104" r="54" fill="none" stroke="#FBEFE3" stroke-opacity="0.08" stroke-width="8"/>
  <circle cx="420" cy="104" r="54" fill="none" stroke="#EB5E34" stroke-width="8" stroke-linecap="round"
    stroke-dasharray="78.3 339.3" transform="rotate(-90 420 104)"/>
  <text x="420" y="110" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#FBEFE3">3</text>
  <text x="420" y="130" text-anchor="middle" class="sans" font-size="11" fill="#B9A79A">day streak</text>
  <text x="420" y="190" text-anchor="middle" class="sans" font-size="13" fill="#B9A79A">Best: <tspan fill="#D9A56B" font-weight="600">13 days</tspan></text>
</svg>
