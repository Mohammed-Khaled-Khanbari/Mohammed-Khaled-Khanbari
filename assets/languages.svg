<svg xmlns="http://www.w3.org/2000/svg" width="520" height="220" viewBox="0 0 520 220" role="img" aria-label="Most used languages: JavaScript">
  <title>Most used languages: JavaScript</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#211613"/><stop offset="1" stop-color="#140E0C"/></linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; } .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .fade { animation: fade .7s ease-out backwards; }
      @keyframes fade { from { opacity: 0 } }
      .grow { transform-box: fill-box; transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) backwards; }
      @keyframes grow { from { transform: scaleX(0) } }
      @media (prefers-reduced-motion: reduce) { .fade, .grow { animation: none } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="519" height="219" rx="16" fill="url(#bg)" stroke="rgba(251,239,227,0.10)"/>
  <rect x="28" y="31" width="8" height="8" rx="2" fill="#EB5E34"/>
  <text x="46" y="40" class="mono" font-size="12" letter-spacing="2.4" fill="#D9A56B">LANGUAGES</text>
  <clipPath id="bar"><rect x="28" y="62" width="464" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar)" class="grow"><rect x="28.00" y="62" width="464.50" height="12" fill="#EB5E34"/></g>
  <g class="fade" style="animation-delay:0.2s">
    <circle cx="34" cy="107" r="6" fill="#EB5E34"/>
    <text x="50" y="112" class="sans" font-size="15" fill="#FBEFE3">JavaScript</text>
    <text x="248" y="112" text-anchor="end" class="mono" font-size="13" fill="#B9A79A">100.0%</text>
  </g>
</svg>
